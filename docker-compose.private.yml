# 本地私有化编排：Postgres(pgvector) + Redis + Web + Worker（+ 热榜/RSS 可选源）
# 不要 Nginx / HTTPS / xray。浏览器直连 http://localhost:3000
#
# 用法：
#   1. cp .env.private.example .env.private && chmod 600 .env.private
#      （按注释填 BEACON_MASTER_KEY / 密码；URL 保持 http://localhost:3000）
#   2. docker compose --env-file .env.private -f docker-compose.private.yml up -d --build
#   3. 打开 http://localhost:3000 → 走装机向导设管理员密码
#
# 与 docker-compose.yml（SaaS 生产）的差别：库在本编排里；无 proxy/certbot/xray/web_b。

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/private-local/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # 仅本机调试（psql / GUI）；应用走 compose 内网服务名 postgres
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性：建表 + 跑 prisma/postgres/*.sql + 灌敏感词/算法规则。
  # web/worker 依赖它成功结束；重复 up 时若已初始化，脚本是幂等的。
  db-init:
    image: beacon-web:latest
    build: .
    restart: 'no'
    env_file: .env.private
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-beacon}?schema=beacon&connection_limit=5
    volumes:
      # 生产镜像不带 scripts/；挂进来跑 sync-system-data
      - ./scripts:/app/scripts:ro
    entrypoint: ['/bin/sh', '/app/scripts/docker-private-db-init.sh']
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: beacon-web:latest
    build: .
    restart: unless-stopped
    env_file: .env.private
    environment: &app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-beacon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-beacon}?schema=beacon&connection_limit=5
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BEACON_QUEUE: bullmq
      BEACON_EDITION: private
      BEACON_ENV: prod
      BEACON_RSSHUB_BASE_URL: http://rsshub:1200
      BEACON_DAILYHOT_BASE_URL: http://dailyhot:6688
      # 故意不设 BEACON_HTTP_PROXY（不要 xray）
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    ports:
      - '${BEACON_WEB_BIND:-127.0.0.1}:${BEACON_WEB_PORT:-3000}:3000'

  worker:
    image: beacon-web:latest
    restart: unless-stopped
    command: ['node_modules/.bin/tsx', 'worker.ts']
    env_file: .env.private
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_EXPIRE: '3600'

  dailyhot:
    image: imsyy/dailyhot-api:latest
    restart: unless-stopped
    environment:
      PORT: '6688'

volumes:
  pgdata:
  redisdata:
